name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check ArcGIS-era Python compatibility
        if: matrix.python == '3.11'
        run: python -m unittest discover -s tests -v
      - name: Install pinned build dependencies
        if: matrix.python == '3.14.7'
        run: python -m pip install -r requirements-build.txt
      - name: Build and verify the portable Windows app
        if: matrix.python == '3.14.7'
        run: python build.py
