name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Verify version
        shell: python
        run: |
          import os
          import runpy
          version = runpy.run_path("version.py")["VERSION"]
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - run: python -m pip install -r requirements-build.txt
      - run: python build.py
      - name: Publish portable app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match "\.(zip|sha256)$" } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @releaseAssets --title "TSMIS Project Inspector $env:GITHUB_REF_NAME" --generate-notes
